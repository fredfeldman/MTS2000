name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore MTS2000.slnx

      - name: Build
        run: dotnet build MTS2000.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test MTS2000.slnx --no-build --configuration Release
